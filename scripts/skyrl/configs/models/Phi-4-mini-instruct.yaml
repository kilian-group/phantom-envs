# Phi-4-mini-instruct: its recommended sampling (temperature 0.8, top_p 0.95).
# For evals only: Megatron can't train it (Megatron-Bridge has no Phi-3 converter). The paper's Phi runs
# trained with FSDP, at the repo's `paper` tag.
trainer:
  policy:
    model:
      path: microsoft/Phi-4-mini-instruct

generator:
  sampling_params:
    temperature: 0.8
    top_p: 0.95
