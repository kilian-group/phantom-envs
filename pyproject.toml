[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-envs"
description = "PhantomEnvironments: Training LLM Agents in Fictional Worlds"
version = "0.1.0"
authors = [
    {name = "Anmol Kabra", email = "anmol@cs.cornell.edu"},
    {name = "Swathi Saravana Selvam", email = "ss4522@cornell.edu"},
    {name = "Albert Gong", email = "agong@cs.cornell.edu"},
    {name = "Chao Wan", email = "cw862@cornell.edu"},
    {name = "Christian Belardi", email = "ckb73@cornell.edu"},
    {name = "Dongyoung Go", email = "dg793@cornell.edu"},
    {name = "Katie Z. Luo", email = "katieluo@stanford.edu"},
    {name = "Kilian Q. Weinberger", email = "kqw4@cornell.edu"},
]
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # phantom_envs: environment generation (needs SWI-Prolog installed), the search protocol, scoring
    # and the retriever client
    "numpy",
    "pydantic",
    "requests",
    "omegaconf",
    "tqdm",
    "nltk",
    "pyswip",
    "networkx",
]

[project.optional-dependencies]
# SkyRL training and evaluation (Megatron backend with vLLM), with everything around it: the retrieval
# server and index builder (FAISS comes from `uv run --with faiss-cpu==1.12.0`, or conda's faiss-gpu
# for Search-R1's 21M-document index), the benchmark builders (FRAMES fetches Wikipedia wikitext at a
# pinned revision) and reproduce_paper/ (lm-eval for the paper's MMLU eval)
skyrl = [
    "skyrl[megatron]",
    "wandb",
    "transformers",
    "safetensors",
    "fastapi",
    "uvicorn",
    "sentence-transformers",
    "datasets",
    "huggingface_hub",
    "mwparserfromhell",
    "pandas",
    "pyarrow",
    "tabulate",
    "matplotlib",
    "pyyaml",
    "lm-eval",
]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[project.scripts]
phantom_envs = "phantom_envs.__main__:cli"

[project.urls]
Homepage = "https://github.com/kilian-group/phantom-envs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phantom_envs.generator" = ["data/*.json", "rules/*.pl"]

[tool.pytest.ini_options]
# Only the test dirs: data/ and scratch/ can be links to large shared storage
testpaths = ["tests", "reproduce_paper/tests"]

[tool.uv]
index-strategy = "unsafe-best-match"
# SkyRL's megatron and other GPU extras conflict — select only megatron
conflicts = [
    [
        {package = "skyrl", extra = "jax"},
        {package = "skyrl", extra = "megatron"},
        {package = "skyrl", extra = "fsdp"},
    ],
]
# Copied from SkyRL's pyproject.toml at the pinned rev. uv applies SkyRL's [tool.uv.sources] (its
# prebuilt wheels and git pins) to SkyRL's own requirements, but not its overrides, indexes or build
# settings, so those are repeated here. Update them together with the rev.
override-dependencies = [
    "megatron-core>=0.16.0; sys_platform == 'linux'",
    "transformers>=5.6.1,<=5.16.1; sys_platform == 'linux'",
    "nixl-cu12; sys_platform == 'never'",
    "flashinfer-python==0.7.0.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.7.0.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache-sm110a==0.7.0.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-jit-cache-sm121a==0.7.0.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-cubin==0.7.0.post1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tilelang==0.1.13; sys_platform == 'linux'",
    "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
    "nvidia-cutlass-dsl[cu13]==4.8.0; sys_platform == 'linux'",
    "quack-kernels[cu13]==0.6.5; sys_platform == 'linux'",
    "xgrammar==0.2.8",
    "torch==2.13.0; sys_platform == 'linux'",
    "torchvision==0.28.0; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/"
explicit = true

[tool.uv.extra-build-variables]
# NVRx builds from git: skip its CUPTI extension, which needs the CUDA headers
nvidia-resiliency-ext = {STRAGGLER_DET_SKIP_CUPTI_EXT_BUILD = "1"}

[tool.uv.sources]
skyrl = {git = "https://github.com/novasky-ai/SkyRL", rev = "dd8769f"}
torch = {index = "pytorch-cu130", marker = "sys_platform == 'linux'"}
torchvision = {index = "pytorch-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm100a = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm103a = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm120f = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm80 = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm89 = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm90a = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm110a = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-jit-cache-sm121a = {index = "flashinfer-cu130", marker = "sys_platform == 'linux'"}
flashinfer-cubin = {index = "flashinfer", marker = "sys_platform == 'linux'"}
# Megatron-Core at the commit Megatron-Bridge is built against (the override above drops SkyRL's source)
megatron-core = {git = "https://github.com/NVIDIA/Megatron-LM", rev = "07147d6942dfd4e6d1566b64bb1730f478a1bc32", marker = "sys_platform == 'linux'"}
